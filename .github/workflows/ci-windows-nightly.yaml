# CI AUTOMATION YAML FILE
# This scripts runs a build process on every push to the repository
# Better suited for nightly/test builds required by testers or players.
# This has not been tested on gitea and should only work (afaik) on Github Actions

# Most of this uses the README.md way of building, the only thing i kept after analyzing the bat file
# Was the ZIP Filename structure (NAME - PLATFORM - COMMIT HASH)

name: Waystone Nightly - Windows
on: [push]

jobs:
  build:
    #Uses Windows-2022 to force the VS 2022 version required by the CMAKE command under the Build Step
    runs-on: windows-2022
    # Uncomment this in case of error.
    #permissions: 
      #actions: write
    steps:
      # Clones the repo inside the VM
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the VC++ Environment as x64 architecture
      - name: Setup devcmd
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
            arch: x64
      # Builds the binaries
      - name: Build
        run: |
          mkdir build 
          cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build/x64 --config Release --target WowClient --parallel
      # Prepares needed files for upload
      - name: Pre-Upload
        run: |
            ls
            mkdir upload 
            xcopy "bin\*" "upload\" /E /H /Y
      # Uploads the artifact to the action page
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Waystone - Commit ${{github.sha}}.zip
          path: upload/
